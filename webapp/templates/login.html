<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2311141c'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%235b9fd4' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%235b9fd4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14;--panel:#141922;--border:#252b38;--text:#e8ecf4;--muted:#8b93a7;
  --red:#e05a5a;--blue:#5b9fd4;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;color:var(--text);
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(900px 420px at 8% -8%, #1a3a5522, transparent 55%),
    radial-gradient(700px 380px at 92% 0%, #1a3d2f18, transparent 50%),
    var(--bg);
}
.card{
  width:min(420px,100%);background:var(--panel);border:1px solid var(--border);
  border-radius:18px;padding:28px 26px 24px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mark{width:42px;height:42px;border-radius:12px;background:#1a2030;border:1px solid var(--border);display:grid;place-items:center}
h1{margin:0;font-size:1.35rem;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:.86rem;margin-top:3px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=password]{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:#0e121a;color:var(--text);font:500 1rem 'DM Sans',system-ui,sans-serif;
  outline:none;
}
input[type=password]:focus{border-color:var(--blue)}
button{
  width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;
  background:var(--blue);color:#0b1220;font:700 .95rem 'DM Sans',system-ui,sans-serif;
  cursor:pointer;
}
button:hover{filter:brightness(1.08)}
.err{display:none;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:#1c1414;border:1px solid #e05a5a55;color:#efb0b0;font-size:.84rem}
.err.show{display:block}
.hint{margin:16px 0 0;color:var(--muted);font-size:.78rem;line-height:1.45}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#5b9fd4" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="#5b9fd4" stroke="none"/></svg>
    </div>
    <div>
      <h1>Orbit</h1>
      <div class="sub">Enter the dashboard password</div>
    </div>
  </div>
  <p class="err{% if error %} show{% endif %}">Wrong password. Try again.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  <p class="hint">This site is on your Oracle VM. Only people with the password can see trades or press Start.</p>
</form>
</body>
</html>
